<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SugarCrash! — Rhythm Game</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0612;--lane0:#ff2d95;--lane1:#00e5ff;--lane2:#b388ff;--lane3:#76ff03;
  --glow0:#ff2d9580;--glow1:#00e5ff80;--glow2:#b388ff80;--glow3:#76ff0380;
}
html,body{width:100%;height:100%;background:var(--bg);overflow:hidden;font-family:'Rajdhani',sans-serif;color:#fff;user-select:none;touch-action:manipulation;position:fixed;inset:0}

#bg-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}

/* ═══ HIGHWAY ═══ */
#game-container{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#highway{position:relative;width:min(380px,100vw);height:100%;background:linear-gradient(180deg,rgba(10,5,18,0.95),rgba(20,10,40,0.9));border-left:1px solid rgba(255,255,255,0.05);border-right:1px solid rgba(255,255,255,0.05);z-index:2;overflow:hidden}
.ld{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,0.06);z-index:1}

/* Hit zone — positioned above touch buttons */
#hit-zone{position:absolute;bottom:110px;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--lane0),var(--lane1),var(--lane2),var(--lane3));z-index:10;box-shadow:0 0 20px rgba(255,255,255,0.3),0 0 60px rgba(180,100,255,0.2)}

/* ═══ RECEPTORS (visual only, above touch pads) ═══ */
.rec{position:absolute;bottom:96px;width:calc(25% - 8px);height:24px;border:2px solid;border-radius:6px;z-index:11;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',monospace;font-size:11px;font-weight:700;letter-spacing:1px;transition:background .06s,box-shadow .06s,transform .06s}
.rec.l0{left:4px;border-color:var(--lane0);color:var(--lane0)}
.rec.l1{left:calc(25% + 1px);border-color:var(--lane1);color:var(--lane1)}
.rec.l2{left:calc(50% + 1px);border-color:var(--lane2);color:var(--lane2)}
.rec.l3{left:calc(75% - 2px);border-color:var(--lane3);color:var(--lane3)}
.rec.on{transform:scale(1.05)}
.rec.on.l0{background:var(--glow0);box-shadow:0 0 20px var(--glow0)}
.rec.on.l1{background:var(--glow1);box-shadow:0 0 20px var(--glow1)}
.rec.on.l2{background:var(--glow2);box-shadow:0 0 20px var(--glow2)}
.rec.on.l3{background:var(--glow3);box-shadow:0 0 20px var(--glow3)}

/* ═══ TOUCH PADS — bottom of screen ═══ */
#touch-pads{position:absolute;bottom:0;left:0;right:0;height:90px;display:flex;z-index:15;gap:2px;padding:2px}
.tpad{flex:1;border-radius:8px 8px 4px 4px;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',monospace;font-size:16px;font-weight:900;letter-spacing:2px;opacity:0.35;transition:opacity .06s,transform .06s;border:none;background:none;color:inherit;cursor:pointer;-webkit-user-select:none}
.tpad.l0{background:linear-gradient(180deg,var(--lane0),#c0206f);color:#fff}
.tpad.l1{background:linear-gradient(180deg,var(--lane1),#0099b3);color:#fff}
.tpad.l2{background:linear-gradient(180deg,var(--lane2),#7e5cb3);color:#fff}
.tpad.l3{background:linear-gradient(180deg,var(--lane3),#55b300);color:#fff}
.tpad.on{opacity:1;transform:scale(0.96)}

/* ═══ NOTES ═══ */
.nt{position:absolute;height:20px;border-radius:4px;z-index:5;pointer-events:none;display:none}
.nt{width:calc(25% - 8px)}
.nt.l0{left:4px;background:linear-gradient(135deg,var(--lane0),#ff6eb4);box-shadow:0 0 10px var(--glow0),inset 0 1px 0 rgba(255,255,255,0.3)}
.nt.l1{left:calc(25% + 1px);background:linear-gradient(135deg,var(--lane1),#4dd0e1);box-shadow:0 0 10px var(--glow1),inset 0 1px 0 rgba(255,255,255,0.3)}
.nt.l2{left:calc(50% + 1px);background:linear-gradient(135deg,var(--lane2),#ce93d8);box-shadow:0 0 10px var(--glow2),inset 0 1px 0 rgba(255,255,255,0.3)}
.nt.l3{left:calc(75% - 2px);background:linear-gradient(135deg,var(--lane3),#aed581);box-shadow:0 0 10px var(--glow3),inset 0 1px 0 rgba(255,255,255,0.3)}
.nt.hold{border-radius:4px 4px 0 0}
.htl{position:absolute;width:calc(12.5% - 2px);z-index:4;pointer-events:none;opacity:0.5;display:none}
.htl.l0{left:calc(12.5% - 11px);background:var(--lane0)}
.htl.l1{left:calc(37.5% - 11px);background:var(--lane1)}
.htl.l2{left:calc(62.5% - 11px);background:var(--lane2)}
.htl.l3{left:calc(87.5% - 14px);background:var(--lane3)}

/* ═══ HUD ═══ */
#hud-l{position:fixed;top:12px;left:12px;z-index:20}
.hlbl{font-family:'Orbitron',monospace;font-size:9px;color:rgba(255,255,255,0.4);letter-spacing:2px;text-transform:uppercase}
#score{font-family:'Orbitron',monospace;font-size:28px;font-weight:900;background:linear-gradient(135deg,var(--lane0),var(--lane1),var(--lane2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
#hud-r{position:fixed;top:12px;right:12px;text-align:right;z-index:20}
#combo{font-family:'Orbitron',monospace;font-size:28px;font-weight:900;color:#fff;line-height:1;transition:transform .08s}
#combo.pop{transform:scale(1.3)}
#acc{position:fixed;top:50px;left:50%;transform:translateX(-50%);z-index:20;font-family:'Orbitron',monospace;font-size:10px;color:rgba(255,255,255,0.5);letter-spacing:2px}
#jdg{position:fixed;top:35%;left:50%;transform:translate(-50%,-50%);font-family:'Orbitron',monospace;font-size:24px;font-weight:900;letter-spacing:3px;z-index:25;opacity:0;transition:opacity .1s,transform .15s;text-shadow:0 0 30px currentColor;pointer-events:none}
#pbar{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--lane0),var(--lane1),var(--lane2),var(--lane3));z-index:30}
#secf{position:fixed;top:22%;left:50%;transform:translate(-50%,-50%);font-family:'Orbitron',monospace;font-size:15px;font-weight:700;letter-spacing:5px;text-transform:uppercase;z-index:22;opacity:0;pointer-events:none;text-shadow:0 0 40px rgba(180,100,255,0.6);color:rgba(255,255,255,0.7);transition:opacity .5s}
#stats{position:fixed;top:65px;right:12px;text-align:right;z-index:20;font-family:'Orbitron',monospace;font-size:8px;color:rgba(255,255,255,0.25);letter-spacing:1px;line-height:1.7}

/* ═══ START SCREEN ═══ */
#startscr{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px}
#startscr h1{font-family:'Orbitron',monospace;font-size:clamp(28px,8vw,48px);font-weight:900;letter-spacing:4px;background:linear-gradient(135deg,var(--lane0),var(--lane1),var(--lane2),var(--lane3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:tp 2s ease-in-out infinite;text-align:center}
@keyframes tp{0%,100%{filter:brightness(1)}50%{filter:brightness(1.3)}}
.sub{font-family:'Rajdhani',sans-serif;font-size:14px;color:rgba(255,255,255,0.4);letter-spacing:3px;text-transform:uppercase;text-align:center}
.kh{margin-top:12px;display:flex;gap:12px}
.kb{width:48px;height:48px;border:2px solid;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',monospace;font-size:16px;font-weight:700}
.kb:nth-child(1){border-color:var(--lane0);color:var(--lane0)}.kb:nth-child(2){border-color:var(--lane1);color:var(--lane1)}
.kb:nth-child(3){border-color:var(--lane2);color:var(--lane2)}.kb:nth-child(4){border-color:var(--lane3);color:var(--lane3)}

#dz{margin-top:20px;width:min(340px,85vw);padding:24px 16px;border:2px dashed rgba(255,255,255,0.15);border-radius:12px;text-align:center;cursor:pointer;transition:all .2s;position:relative}
#dz:hover,#dz.over{border-color:var(--lane1);background:rgba(0,229,255,0.05)}
#dz input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:16px}
.dzt{font-family:'Orbitron',monospace;font-size:12px;color:rgba(255,255,255,0.5);letter-spacing:2px}
.dzs{font-size:11px;color:rgba(255,255,255,0.25);margin-top:6px;letter-spacing:1px}
#astatus{margin-top:8px;font-family:'Orbitron',monospace;font-size:11px;letter-spacing:2px;min-height:18px}
#astatus.ok{color:var(--lane3)}#astatus.err{color:var(--lane0)}
#pbtn{margin-top:14px;padding:14px 44px;font-family:'Orbitron',monospace;font-size:16px;font-weight:700;letter-spacing:4px;background:transparent;color:#fff;border:2px solid var(--lane1);border-radius:8px;cursor:pointer;transition:all .2s;display:none}
#pbtn:hover,#pbtn:active{background:var(--lane1);color:var(--bg);box-shadow:0 0 40px var(--glow1)}
.hint{font-size:11px;opacity:0.35;letter-spacing:2px;margin-top:6px;text-align:center}

/* ═══ RESULTS ═══ */
#resscr{position:fixed;inset:0;z-index:100;background:rgba(10,5,18,0.96);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px}
#resscr h2{font-family:'Orbitron',monospace;font-size:28px;font-weight:900;letter-spacing:5px;background:linear-gradient(135deg,var(--lane0),var(--lane1),var(--lane2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.rr{font-family:'Rajdhani',sans-serif;font-size:18px;color:rgba(255,255,255,0.6);letter-spacing:2px}
.rr span{color:#fff;font-weight:700}
#rank{font-family:'Orbitron',monospace;font-size:64px;font-weight:900;margin:8px 0}
#retry{margin-top:14px;padding:12px 36px;font-family:'Orbitron',monospace;font-size:14px;font-weight:700;letter-spacing:3px;background:transparent;color:#fff;border:2px solid var(--lane2);border-radius:8px;cursor:pointer;transition:all .2s}
#retry:hover,#retry:active{background:var(--lane2);color:var(--bg);box-shadow:0 0 40px var(--glow2)}
.hp{position:fixed;width:5px;height:5px;border-radius:50%;pointer-events:none;z-index:30}

/* Desktop-only: show keyboard hint labels in receptors */
@media (hover: hover) and (pointer: fine) {
  .rec::after{content:attr(data-key)}
  .tpad{opacity:0.15;height:60px}
}
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div id="game-container">
  <div id="highway">
    <div class="ld" style="left:25%"></div>
    <div class="ld" style="left:50%"></div>
    <div class="ld" style="left:75%"></div>
    <div id="hit-zone"></div>
    <div class="rec l0" data-key="D"></div>
    <div class="rec l1" data-key="F"></div>
    <div class="rec l2" data-key="J"></div>
    <div class="rec l3" data-key="K"></div>
    <div id="touch-pads">
      <div class="tpad l0" data-lane="0">D</div>
      <div class="tpad l1" data-lane="1">F</div>
      <div class="tpad l2" data-lane="2">J</div>
      <div class="tpad l3" data-lane="3">K</div>
    </div>
  </div>
</div>
<div id="hud-l"><div class="hlbl">SCORE</div><div id="score">0</div></div>
<div id="hud-r"><div class="hlbl">COMBO</div><div id="combo">0</div></div>
<div id="acc">0.00%</div>
<div id="jdg"></div>
<div id="secf"></div>
<div id="pbar"></div>
<div id="stats">
  <div>PERFECT <span id="sp">0</span></div>
  <div>GREAT <span id="sg">0</span></div>
  <div>GOOD <span id="so">0</span></div>
  <div>MISS <span id="sm">0</span></div>
</div>

<div id="startscr">
  <h1>SUGARCRASH!</h1>
  <div class="sub">ElyOtto — Rhythm Game</div>
  <div class="kh"><div class="kb">D</div><div class="kb">F</div><div class="kb">J</div><div class="kb">K</div></div>
  <div id="dz">
    <input type="file" id="finput">
    <div class="dzt">TAP TO SELECT YOUR MP3</div>
    <div class="dzs">Choose the SugarCrash! audio file</div>
  </div>
  <div id="astatus"></div>
  <button id="pbtn">PLAY</button>
  <div class="sub hint">Tap the colored pads when notes reach the line</div>
</div>

<div id="resscr">
  <h2>RESULTS</h2>
  <div id="rank"></div>
  <div class="rr">SCORE: <span id="fs">0</span></div>
  <div class="rr">MAX COMBO: <span id="fc">0</span></div>
  <div class="rr">ACCURACY: <span id="fa">0%</span></div>
  <div class="rr" style="margin-top:6px">
    PERFECT <span id="fp" style="color:var(--lane1)">0</span> ·
    GREAT <span id="fg" style="color:var(--lane3)">0</span> ·
    GOOD <span id="fgo" style="color:var(--lane2)">0</span> ·
    MISS <span id="fm" style="color:var(--lane0)">0</span>
  </div>
  <button id="retry">RETRY</button>
</div>

<script>
// ══════════════════════════════════════════════════════
// SugarCrash! Rhythm Game — iOS + Desktop
// 98 BPM · 4/4 · F Major · Bb→F→C→Dm · ~81s
// ══════════════════════════════════════════════════════
const BPM=98,BS=60/BPM,SPD=550;
const PW=.060,GW=.110,OW=.160,MW=.210; // slightly wider for touch
const LC=["#ff2d95","#00e5ff","#b388ff","#76ff03"];
const KS=["d","f","j","k"];

function b(n){return n*BS}

// ── CHART ─────────────────────────────────────────────
const CHART=[
  // INTRO (0-15)
  {t:b(2),l:0},{t:b(4),l:1},{t:b(6),l:2},{t:b(7),l:3},
  {t:b(8),l:0},{t:b(8),l:1},{t:b(10),l:2},{t:b(10),l:3},
  {t:b(12),l:0},{t:b(13),l:1},{t:b(14),l:2},{t:b(15),l:3},

  // CHORUS 1 (16-31)
  {t:b(16),l:0},{t:b(16.5),l:1},{t:b(17),l:0},{t:b(18),l:1},
  {t:b(19),l:1},{t:b(19.5),l:2},{t:b(20),l:1},{t:b(20.5),l:3},
  {t:b(21),l:2},{t:b(21.5),l:3},{t:b(22),l:2},{t:b(22.5),l:1},
  {t:b(23),l:3},{t:b(23.5),l:0},{t:b(24),l:3},{t:b(24),l:2},
  {t:b(25),l:0},{t:b(25.5),l:1},{t:b(26),l:0},{t:b(26.5),l:2},
  {t:b(27),l:1},{t:b(27.5),l:3},{t:b(28),l:1},{t:b(28),l:2},
  {t:b(29),l:2},{t:b(29.5),l:0},{t:b(30),l:3},{t:b(30.5),l:1},
  {t:b(31),l:0},{t:b(31),l:3},

  // BREAK (32-39)
  {t:b(32),l:0},{t:b(32),l:3},{t:b(33),l:1},{t:b(33),l:2},
  {t:b(34),l:0},{t:b(34.5),l:1},{t:b(35),l:2},{t:b(35.5),l:3},
  {t:b(36),l:3},{t:b(36),l:0},{t:b(37),l:2},{t:b(37),l:1},
  {t:b(38),l:0},{t:b(38.5),l:2},{t:b(39),l:1},{t:b(39.5),l:3},

  // VERSE (40-72)
  {t:b(40),l:0},{t:b(40.5),l:1},{t:b(41),l:0},{t:b(41.5),l:2},{t:b(42),l:1},
  {t:b(42.5),l:3},{t:b(43),l:1},{t:b(43.5),l:2},{t:b(44),l:3},
  {t:b(44.5),l:2},{t:b(45),l:3},{t:b(45.5),l:0},{t:b(46),l:2},
  {t:b(46.5),l:1},{t:b(47),l:3},{t:b(47.5),l:0},{t:b(47.5),l:3},
  {t:b(48),l:0},{t:b(48.5),l:1},{t:b(49),l:2},{t:b(49.5),l:0},{t:b(50),l:1},
  {t:b(50.5),l:3},{t:b(51),l:2},{t:b(51.5),l:1},{t:b(52),l:3},{t:b(52),l:0},
  // b-b-b-b-b stutter
  {t:b(53),l:2},{t:b(53.25),l:3},{t:b(53.5),l:0},{t:b(53.75),l:1},
  {t:b(54),l:2},{t:b(54.25),l:3},{t:b(54.5),l:0},{t:b(54.75),l:1},
  {t:b(55),l:2},{t:b(55),l:3},
  {t:b(55.5),l:0},{t:b(55.5),l:3},
  {t:b(56),l:0},{t:b(56.5),l:1},{t:b(57),l:0},{t:b(57.5),l:2},{t:b(58),l:1},
  {t:b(58.5),l:3},{t:b(59),l:1},{t:b(59.5),l:2},{t:b(60),l:3},{t:b(60),l:0},
  {t:b(60.5),l:2},{t:b(61),l:0},{t:b(61.5),l:3},{t:b(62),l:2},{t:b(62.5),l:1},
  {t:b(63),l:3},{t:b(63.5),l:0},{t:b(64),l:1},{t:b(64),l:3},
  {t:b(64.5),l:0},{t:b(65),l:1},{t:b(65.5),l:2},{t:b(66),l:0},{t:b(66.5),l:3},
  {t:b(67),l:1},{t:b(67.5),l:2},{t:b(68),l:3},{t:b(68.5),l:0},
  {t:b(69),l:2},{t:b(69.5),l:1},{t:b(70),l:0},{t:b(70.5),l:3},{t:b(71),l:2},
  {t:b(71.5),l:1},{t:b(72),l:0},{t:b(72),l:3},

  // CHORUS 2 (73-87)
  {t:b(73),l:0},{t:b(73),l:1},{t:b(74),l:2},{t:b(74.5),l:3},
  {t:b(75),l:1},{t:b(75.5),l:0},{t:b(76),l:3},{t:b(76.5),l:2},
  {t:b(77),l:2},{t:b(77),l:3},{t:b(78),l:0},{t:b(78.5),l:1},
  {t:b(79),l:3},{t:b(79.5),l:2},{t:b(80),l:0},{t:b(80),l:1},
  {t:b(81),l:0},{t:b(81.5),l:1},{t:b(82),l:2},{t:b(82.5),l:3},
  {t:b(83),l:1},{t:b(83),l:3},{t:b(84),l:0},{t:b(84),l:2},
  {t:b(85),l:2},{t:b(85.5),l:1},{t:b(86),l:3},{t:b(86.5),l:0},
  {t:b(87),l:0},{t:b(87),l:1},{t:b(87),l:2},{t:b(87),l:3},

  // BRIDGE (88-103)
  {t:b(89),l:0,h:2},{t:b(89),l:3,h:2},
  {t:b(92),l:2},{t:b(92.5),l:1},{t:b(93),l:3},
  {t:b(94),l:0},{t:b(94.5),l:2},{t:b(95),l:1},{t:b(95),l:3},
  {t:b(96),l:0},{t:b(96.5),l:1},{t:b(97),l:2},
  {t:b(98),l:3},{t:b(98.5),l:0},{t:b(99),l:1},{t:b(99),l:2},
  {t:b(100),l:3},{t:b(100.5),l:2},{t:b(101),l:1},{t:b(101.5),l:0},
  {t:b(102),l:3},{t:b(102),l:0},{t:b(103),l:1},{t:b(103),l:2},

  // OUTRO (104-128)
  {t:b(105),l:1,h:2},{t:b(105),l:2,h:2},
  {t:b(108),l:0},{t:b(108.5),l:3},{t:b(109),l:1},{t:b(109.5),l:2},
  {t:b(110),l:0},{t:b(110),l:3},{t:b(111),l:1},{t:b(111),l:2},
  {t:b(112),l:0},{t:b(112.5),l:1},{t:b(113),l:2},{t:b(113.5),l:3},
  {t:b(114),l:0},{t:b(114),l:3},{t:b(114.5),l:1},{t:b(114.5),l:2},
  {t:b(115),l:0},{t:b(115),l:1},{t:b(115),l:2},{t:b(115),l:3},
  {t:b(118),l:0},{t:b(118),l:3},
  {t:b(120),l:1},{t:b(120),l:2},
  {t:b(124),l:0},{t:b(124),l:1},{t:b(124),l:2},{t:b(124),l:3},
].sort((a,c)=>a.t-c.t);

const SECS=[
  {t:b(0),s:"INTRO"},{t:b(16),s:"CHORUS"},{t:b(32),s:"BREAK"},
  {t:b(40),s:"VERSE"},{t:b(72),s:"CHORUS"},{t:b(88),s:"BRIDGE"},{t:b(104),s:"OUTRO"},
];

// ── STATE ─────────────────────────────────────────────
let audio=null,aUrl=null,gameOn=false;
let sc=0,co=0,mx=0;
let J={p:0,g:0,o:0,m:0};
let NS=[],KD={},lSec=-1,hitY=0;
function cHY(){hitY=innerHeight-110} cHY();addEventListener("resize",cHY);

// ── BACKGROUND ────────────────────────────────────────
const cv=document.getElementById("bg-canvas"),ctx=cv.getContext("2d");
let pp=[];
function rCV(){cv.width=innerWidth;cv.height=innerHeight} rCV();addEventListener("resize",rCV);
for(let i=0;i<40;i++)pp.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-.5)*.3,vy:-Math.random()*.5-.1,r:Math.random()*2+.5,c:LC[~~(Math.random()*4)],a:Math.random()*.25+.05});
let bP=0;
function dBG(t){
  ctx.clearRect(0,0,cv.width,cv.height);
  if(gameOn&&t>0){const ph=(t%BS)/BS;bP=Math.max(0,1-ph*3);if(bP>0){const g=ctx.createRadialGradient(cv.width/2,cv.height/2,0,cv.width/2,cv.height/2,cv.width*.6);g.addColorStop(0,`rgba(100,50,180,${bP*.07})`);g.addColorStop(1,"transparent");ctx.fillStyle=g;ctx.fillRect(0,0,cv.width,cv.height)}}else bP=0;
  for(const p of pp){p.x+=p.vx;p.y+=p.vy;if(p.y<-10){p.y=cv.height+10;p.x=Math.random()*cv.width}if(p.x<-10)p.x=cv.width+10;if(p.x>cv.width+10)p.x=-10;ctx.beginPath();ctx.arc(p.x,p.y,p.r+bP*1.2,0,Math.PI*2);ctx.fillStyle=p.c;ctx.globalAlpha=p.a+bP*.08;ctx.fill()}
  ctx.globalAlpha=1;
}

// ── DOM ───────────────────────────────────────────────
const hw=document.getElementById("highway");
const $sc=document.getElementById("score"),$co=document.getElementById("combo");
const $jd=document.getElementById("jdg"),$pb=document.getElementById("pbar");
const $sf=document.getElementById("secf"),$ac=document.getElementById("acc");
const recs=document.querySelectorAll(".rec");
const tpads=document.querySelectorAll(".tpad");
const $st=document.getElementById("startscr"),$rs=document.getElementById("resscr");

// ── AUDIO ─────────────────────────────────────────────
const dz=document.getElementById("dz"),fi=document.getElementById("finput");
const as_=document.getElementById("astatus"),pbtn=document.getElementById("pbtn");

function handleFile(f){
  if(!f)return;
  if(aUrl)URL.revokeObjectURL(aUrl);
  aUrl=URL.createObjectURL(f);
  const ta=new Audio();ta.src=aUrl;
  ta.addEventListener("canplaythrough",()=>{
    as_.textContent="✓ "+f.name.substring(0,28);as_.className="ok";
    pbtn.style.display="inline-block";
  },{once:true});
  ta.addEventListener("error",()=>{
    as_.textContent="✗ LOAD FAILED";as_.className="err";pbtn.style.display="none";
  },{once:true});
  ta.load();
}

fi.addEventListener("change",e=>{if(e.target.files[0])handleFile(e.target.files[0])});
dz.addEventListener("dragover",e=>{e.preventDefault();dz.classList.add("over")});
dz.addEventListener("dragleave",()=>dz.classList.remove("over"));
dz.addEventListener("drop",e=>{e.preventDefault();dz.classList.remove("over");if(e.dataTransfer.files[0])handleFile(e.dataTransfer.files[0])});

// ── NOTE RENDERING ────────────────────────────────────
function buildN(){
  hw.querySelectorAll(".nt,.htl").forEach(e=>e.remove());
  NS=CHART.map(c=>{
    const el=document.createElement("div");el.className=`nt l${c.l}`;hw.appendChild(el);
    let tr=null;
    if(c.h){el.classList.add("hold");tr=document.createElement("div");tr.className=`htl l${c.l}`;hw.appendChild(tr)}
    return{hit:false,miss:false,done:false,el,tr};
  });
}

function drawN(t){
  for(let i=0;i<CHART.length;i++){
    const c=CHART[i],s=NS[i];
    if(s.hit||s.miss){s.el.style.display="none";if(s.tr)s.tr.style.display="none";continue}
    const dt=c.t-t,y=hitY-dt*SPD;
    if(y<-100||y>innerHeight+50){s.el.style.display="none";if(s.tr)s.tr.style.display="none"}
    else{s.el.style.display="block";s.el.style.top=(y-10)+"px";if(s.tr&&c.h){const th=c.h*BS*SPD;s.tr.style.display="block";s.tr.style.top=(y-10-th)+"px";s.tr.style.height=th+"px"}}
    if(dt<-MW&&!s.done){s.miss=true;s.done=true;doM()}
  }
}

// ── HIT DETECTION ─────────────────────────────────────
function findN(lane,t){
  let best=-1,bd=Infinity;
  for(let i=0;i<CHART.length;i++){const c=CHART[i],s=NS[i];if(c.l!==lane||s.hit||s.miss||s.done)continue;const d=Math.abs(c.t-t);if(d<bd&&d<=MW){bd=d;best=i}}
  return best;
}

function doH(lane){
  if(!gameOn||!audio)return;
  const t=audio.currentTime,i=findN(lane,t);if(i<0)return;
  NS[i].hit=true;NS[i].done=true;
  const d=Math.abs(CHART[i].t-t);
  let lb,pt,cl;
  if(d<=PW){lb="PERFECT";pt=300;cl=LC[1];J.p++}
  else if(d<=GW){lb="GREAT";pt=200;cl=LC[3];J.g++}
  else{lb="GOOD";pt=100;cl=LC[2];J.o++}
  co++;if(co>mx)mx=co;
  sc+=pt*(co>=50?4:co>=30?3:co>=10?2:1);
  rHUD(lb,cl);boom(lane,cl);
}
function doM(){J.m++;co=0;fJ("MISS",LC[0]);rHUD()}

// ── HUD ───────────────────────────────────────────────
function rHUD(lb,cl){
  $sc.textContent=sc.toLocaleString();$co.textContent=co;
  $co.classList.add("pop");setTimeout(()=>$co.classList.remove("pop"),80);
  if(lb)fJ(lb,cl);
  document.getElementById("sp").textContent=J.p;document.getElementById("sg").textContent=J.g;
  document.getElementById("so").textContent=J.o;document.getElementById("sm").textContent=J.m;
  const tot=J.p+J.g+J.o+J.m;
  if(tot>0)$ac.textContent=(((J.p*100+J.g*80+J.o*50)/(tot*100))*100).toFixed(1)+"%";
}
let jT=0;
function fJ(t,c){$jd.textContent=t;$jd.style.color=c;$jd.style.opacity=1;$jd.style.transform="translate(-50%,-50%) scale(1.1)";clearTimeout(jT);jT=setTimeout(()=>{$jd.style.opacity=0;$jd.style.transform="translate(-50%,-50%) scale(.9)"},280)}

// ── PARTICLES ─────────────────────────────────────────
function boom(lane,color){
  const hw_rect=hw.getBoundingClientRect();
  const laneW=hw_rect.width/4;
  const bx=hw_rect.left+laneW*lane+laneW/2, by=hitY;
  for(let i=0;i<6;i++){
    const p=document.createElement("div");p.className="hp";p.style.background=color;
    p.style.left=bx+"px";p.style.top=by+"px";p.style.opacity=1;document.body.appendChild(p);
    const ang=(Math.PI*2/6)*i+Math.random()*.5,sp=60+Math.random()*80;
    const dx=Math.cos(ang)*sp,dy=Math.sin(ang)*sp-50;let s0=null;
    (function anim(ts){if(!s0)s0=ts;const el=(ts-s0)/1000;if(el>.4){p.remove();return}const pr=el/.4;p.style.left=(bx+dx*pr)+"px";p.style.top=(by+dy*pr+150*pr*pr)+"px";p.style.opacity=1-pr;requestAnimationFrame(anim)})(performance.now());
  }
}

// ── SECTIONS ──────────────────────────────────────────
function chkS(t){let idx=-1;for(let i=SECS.length-1;i>=0;i--)if(t>=SECS[i].t){idx=i;break}if(idx!==lSec&&idx>=0){lSec=idx;$sf.textContent=SECS[idx].s;$sf.style.opacity=1;setTimeout(()=>$sf.style.opacity=0,1500)}}

// ═══════════════════════════════════════════════════════
// INPUT — Keyboard + Touch (multi-touch)
// ═══════════════════════════════════════════════════════

// Keyboard
document.addEventListener("keydown",e=>{const k=e.key.toLowerCase();if(KD[k])return;KD[k]=true;const li=KS.indexOf(k);if(li>=0){recs[li].classList.add("on");tpads[li].classList.add("on");doH(li)}});
document.addEventListener("keyup",e=>{const k=e.key.toLowerCase();KD[k]=false;const li=KS.indexOf(k);if(li>=0){recs[li].classList.remove("on");tpads[li].classList.remove("on")}});

// Touch — multi-touch support
const activeTouches = {};

document.getElementById("touch-pads").addEventListener("touchstart", e => {
  e.preventDefault();
  for(const touch of e.changedTouches){
    const el = document.elementFromPoint(touch.clientX, touch.clientY);
    if(el && el.dataset.lane !== undefined){
      const lane = parseInt(el.dataset.lane);
      activeTouches[touch.identifier] = lane;
      recs[lane].classList.add("on");
      tpads[lane].classList.add("on");
      doH(lane);
    }
  }
}, {passive:false});

document.getElementById("touch-pads").addEventListener("touchend", e => {
  e.preventDefault();
  for(const touch of e.changedTouches){
    const lane = activeTouches[touch.identifier];
    if(lane !== undefined){
      recs[lane].classList.remove("on");
      tpads[lane].classList.remove("on");
      delete activeTouches[touch.identifier];
    }
  }
}, {passive:false});

document.getElementById("touch-pads").addEventListener("touchcancel", e => {
  for(const touch of e.changedTouches){
    const lane = activeTouches[touch.identifier];
    if(lane !== undefined){
      recs[lane].classList.remove("on");
      tpads[lane].classList.remove("on");
      delete activeTouches[touch.identifier];
    }
  }
}, {passive:false});

// ═══════════════════════════════════════════════════════
// GAME LOOP
// ═══════════════════════════════════════════════════════
function loop(){
  if(!gameOn)return;
  const t=audio?audio.currentTime:0,dur=audio?(audio.duration||81):81;
  dBG(t);drawN(t);chkS(t);
  $pb.style.width=((t/dur)*100)+"%";
  if(audio&&audio.ended){finish();return}
  requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════════════════
// LIFECYCLE
// ═══════════════════════════════════════════════════════
async function startGame(){
  if(!aUrl){alert("Load an audio file first.");return}
  sc=0;co=0;mx=0;J={p:0,g:0,o:0,m:0};lSec=-1;KD={};
  $sc.textContent="0";$co.textContent="0";$ac.textContent="0.00%";
  ["sp","sg","so","sm"].forEach(id=>document.getElementById(id).textContent="0");
  buildN();
  audio=new Audio();audio.src=aUrl;
  audio.playbackRate=1;
  try{await audio.play()}catch(e){console.error(e);alert("Tap PLAY again to start.");return}
  $st.style.display="none";$rs.style.display="none";
  gameOn=true;requestAnimationFrame(loop);
}

function finish(){
  gameOn=false;
  const tot=J.p+J.g+J.o+J.m;
  let acc=tot>0?((J.p*100+J.g*80+J.o*50)/(tot*100))*100:0;
  let rk,rc;
  if(acc>=95){rk="S+";rc="linear-gradient(135deg,#ffd700,#ff6b00)"}
  else if(acc>=90){rk="S";rc="linear-gradient(135deg,#ffd700,#ffab00)"}
  else if(acc>=80){rk="A";rc="linear-gradient(135deg,#00e5ff,#b388ff)"}
  else if(acc>=70){rk="B";rc="linear-gradient(135deg,#76ff03,#00e5ff)"}
  else if(acc>=60){rk="C";rc="linear-gradient(135deg,#b388ff,#ff2d95)"}
  else{rk="D";rc="linear-gradient(135deg,#ff2d95,#ff6b6b)"}
  document.getElementById("fs").textContent=sc.toLocaleString();
  document.getElementById("fc").textContent=mx;
  document.getElementById("fa").textContent=acc.toFixed(2)+"%";
  document.getElementById("fp").textContent=J.p;document.getElementById("fg").textContent=J.g;
  document.getElementById("fgo").textContent=J.o;document.getElementById("fm").textContent=J.m;
  const re=document.getElementById("rank");re.textContent=rk;re.style.background=rc;
  re.style.webkitBackgroundClip="text";re.style.webkitTextFillColor="transparent";
  $rs.style.display="flex";
}

pbtn.addEventListener("click",startGame);
document.getElementById("retry").addEventListener("click",()=>{if(audio){audio.pause();audio.currentTime=0}$rs.style.display="none";$st.style.display="flex"});

// Spacebar start (desktop)
document.addEventListener("keydown",e=>{if(e.code==="Space"){if($st.style.display!=="none"&&pbtn.style.display!=="none"){e.preventDefault();startGame()}if($rs.style.display==="flex"){e.preventDefault();document.getElementById("retry").click()}}});

// Idle background
(function idle(){if(!gameOn)dBG(0);requestAnimationFrame(idle)})();
</script>
</body>
</html>
